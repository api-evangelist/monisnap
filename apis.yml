aid: monisnap
name: MONI (Ex-Monisnap)
description: 'MONI, formerly Monisnap, is a Paris-based remittance fintech founded in 2017 by Raphaël Rivière,
  Jean-Baptiste Bouvier and Jonathan Brossard. It lets diaspora customers in France, Spain and the United
  Kingdom send money to roughly 150 countries — as cash pickup across a partner network of some 350,000
  payout points, as a transfer into a mobile money wallet, as mobile airtime top-up with more than 800
  operators, or as a prepaid card recharge — through a consumer app and the monisnap.com and allo.monisnap.com
  storefronts. Alongside the consumer product MONI runs a B2B "Moni-as-a-Service" remittance-as-a-service
  platform that banks and neobanks such as Nickel and Bnext embed white-label in their own applications.
  MONISNAP SAS is registered with the French ACPR as a payment services agent of MPS SAS, an authorised
  payment institution (CIB 17738). MONI publishes no public API: there is no developer portal, no API
  reference and no machine-readable contract on any MONI host — the partner platform is reached through a
  sales conversation.'
